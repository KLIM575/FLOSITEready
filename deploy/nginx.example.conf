# Пример, если фронт и API уже на одном хосте через uvicorn — nginx не обязателен.
# Используйте этот снимок, если хотите отдавать статику через nginx, а API — проксировать.

server {
    listen 80;
    server_name _;
    root /var/www/flower-shop/dist;
    index index.html;

    # Отдаём предсжатые файлы (Vite кладёт .gz и .br рядом с ассетами в build).
    # gzip_static — в ядре nginx; brotli_static требует модуля ngx_brotli
    # (Debian/Ubuntu: apt install libnginx-mod-http-brotli-static и load_module в nginx.conf).
    gzip_static on;
    brotli_static on;
    gzip_vary on;

    # Fallback-сжатие на лету для ответов без предсжатой версии (например, API JSON).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        # Имена файлов в /assets/ хэшированы Vite — можно смело кэшировать надолго.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Для SPA не добавляйте на ответ документа Cache-Control: no-store — Chrome тогда не использует
    # back-forward cache при возврате по истории. Достаточно private + max-age=0 или короткого max-age.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
